kind = "web"
previewPath = "/"
title = "Moonveil Creations"
version = "1.0.0"
id = "artifacts/moonveil"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22526

[services.development]
run = "pnpm --filter @workspace/moonveil run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moonveil", "run", "build" ]
publicDir = "artifacts/moonveil/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22526"
BASE_PATH = "/"
